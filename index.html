<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea10</title>
    <style>
        #contenedor{
            width:90%;
            height: 90vh;
            border:1px solid blue;
            margin:auto;
            padding:10px;
            display: grid;
            grid-template-areas: "sup dos dos inf"
                                 "sup cen inn del"
                                 "sup fff cnn del";
            
            gap:10px;
            .uno{
                grid-area:sup;
                background-color: green;
            }
            .dos{
                grid-area:dos ;
                background-color: green;
            }
            .tres{
                grid-area:inf ;
                background-color: red;
            }
            .cuatro{
                grid-area:del ;
                background-color: green;
            }
            .cinco{
                grid-area:cen ;
                background-color: yellow;
            }
            .seis{
                grid-area:cnn ;
                background-color: yellow;
            }
            .siete{
                grid-area:inn ;
                background-color: red;
            }
            .ocho{
                grid-area:fff ;
                background-color: red;
            }
        }
        .caja{
            width: 100%;
            height: 100%;
            border: 1px solid black;
            color: white;
            align-content: center;
            text-align: center;
            
        }
    </style>
</head>
<body>
    <h1>Grid 1</h1>
    <div id="contenedor">
        <div class="caja uno">UNO</div>
        <div class="caja dos">DOS</div>
        <div class="caja tres">TRES</div>
        <div class="caja cuatro">CUATRO</div>
        <div class="caja cinco">CINCO</div>
        <div class="caja seis">SEIS</div>
        <div class="caja siete">SIETE</div>
        <div class="caja ocho">OCHO</div>
    </div>
</body>
</html>
